<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>baseflow-node</title>
    <style>
        #root-loading {
            display: block;
            position: fixed;
            z-index: 9999999;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        @keyframes root-loading-ball {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @keyframes root-loading-text {
            0% {
                opacity: 0.1;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.1;
            }
        }

        #root-loading::before {
            position: absolute;
            left: 50%;
            top: 50%;
            content: '.';
            font-size: 0;
            width: 54px;
            height: 54px;
            background: #ddd;
            border-radius: 54px;
            transform: translate(-50%, -50%) scale(0.5);
            -ms-transform: translate(-50%, -50%) scale(0.5);
            animation: root-loading-ball 1s infinite;
        }

        #root-loading::after {
            font-size: 9px;
            color: #888;
            position: absolute;
            content: 'Loading';
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            -ms-transform: translate(-50%, -50%);
            animation: root-loading-text 1s infinite;
        }
    </style>
    <script type="module" src="./node-DSXu6bYC.js"></script>
</head>

<body>
    <div id="root-loading"></div>
    <div id="root"></div>
</body>

</html>
