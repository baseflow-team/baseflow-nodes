<head>
  <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
  <style type="text/css">
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
  <script src="./index-B29PTAlD.js"></script>
  <script src="./monaco-editor@0.56.0/min/vs/nls/lang/zh-cn.js"></script>
  <script src="./monaco-editor@0.56.0/min/vs/loader.js"></script>
  <script>
    // 'vs/nls' 是 require.config 的顶层配置项，不是 paths 映射；
    // 放进 paths 会让 loader 把它当路径前缀，拼出 [object Object].messages-loader.js
    const initBaseflowMonaco = window.monaco.initMonaco;
    require.config({
      paths: {
        vs: window.location.origin + '/monaco/monaco-editor@0.56.0/min/vs',
      },
    });

    require(
      ['vs/editor/editor.main'],
      initBaseflowMonaco,
      console.error,
    );
  </script>
</head>
